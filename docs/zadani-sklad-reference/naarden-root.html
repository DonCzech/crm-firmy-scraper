                <div class="row">
                    <div class="col-xl-4 col-lg-6">    
                        <div class="form-group">
                            <label class="sr-only" for="frm-signInForm-email">E-mail</label>
                            <input type="email" name="email" placeholder="&#64;" class="form-control" id="frm-signInForm-email" required data-nette-rules='[{"op":":filled","msg":"E-mail is required"}]'>
                        </div>
                    </div>
                    <div class="col-xl-4 col-lg-6">
                        <div class="form-group">
                            <label class="sr-only" for="frm-signInForm-password">Password</label>
                            <input type="password" name="password" placeholder="Password" class="form-control" id="frm-signInForm-password" required data-nette-rules='[{"op":":filled","msg":"Password is required"}]'>
                        </div>
                    </div>
                    <div class="col-xl-4 col-lg-6 float-right">
                        <input class="btn btn-primary btn-block" type="submit" name="send" value="Sign in">
                    </div>
                </div>
            <input type="hidden" name="_do" value="signInForm-submit"></form>


            <div class="intro my-5">
            </div>
        </div>
    </div>
