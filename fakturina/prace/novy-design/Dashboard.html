<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fakturina — Přehled</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');

/* ============================================================
   FAKTURINA — Premium dashboard
   Design tokens: warm paper canvas, ink, emerald accent
   ============================================================ */

:root {
  /* warm paper light theme */
  --canvas: #F4F3EE;
  --canvas-grad: radial-gradient(120% 120% at 85% -10%, #FAF6EE 0%, #F4F3EE 42%, #EFEEE7 100%);
  --surface: #FFFFFF;
  --surface-2: #FBFAF6;
  --surface-inset: #F6F5F0;

  --ink: #15171C;
  --ink-2: #585E68;
  --ink-3: #8A909B;
  --ink-4: #B7BCC4;

  --line: #E7E4DB;
  --line-2: #EFEDE5;

  --accent: #0E7C5A;
  --accent-2: #0A6347;
  --accent-ink: #0B5C43;
  --accent-soft: #E2F1EA;
  --accent-glow: rgba(14,124,90,.18);

  --paid: #0E7C5A;
  --paid-soft: #E2F1EA;
  --pending: #B5791A;
  --pending-soft: #FAEFD8;
  --overdue: #C84357;
  --overdue-soft: #FBE5E9;
  --draft: #6E7480;
  --draft-soft: #EFEDE7;

  --chart-1: #0E7C5A;
  --chart-2: #C8A24A;
  --chart-grid: #ECEAE2;

  --shadow-xs: 0 1px 2px rgba(20,22,28,.05);
  --shadow-sm: 0 1px 2px rgba(20,22,28,.04), 0 2px 6px rgba(20,22,28,.05);
  --shadow-md: 0 2px 6px -2px rgba(20,22,28,.06), 0 10px 24px -8px rgba(20,22,28,.10);
  --shadow-lg: 0 4px 10px -4px rgba(20,22,28,.08), 0 28px 56px -16px rgba(20,22,28,.18);
  --shadow-accent: 0 8px 22px -6px var(--accent-glow);

  --radius-xl: 22px;
  --radius-lg: 18px;
  --radius-md: 13px;
  --radius-sm: 9px;
  --radius-pill: 999px;

  --sidebar-w: 268px;
  --topbar-h: 74px;
  --gap: 20px;

  --font-display: 'Schibsted Grotesk', system-ui, sans-serif;
  --font-body: 'Hanken Grotesk', system-ui, sans-serif;

  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);

  color-scheme: light;
}

[data-theme="dark"] {
  --canvas: #0B0D10;
  --canvas-grad: radial-gradient(120% 120% at 85% -10%, #14181E 0%, #0D0F13 45%, #08090C 100%);
  --surface: #15181D;
  --surface-2: #181C22;
  --surface-inset: #11141A;

  --ink: #F1F2F4;
  --ink-2: #A4ABB6;
  --ink-3: #707783;
  --ink-4: #4C535E;

  --line: #262B33;
  --line-2: #20242B;

  --accent: #2ED3A3;
  --accent-2: #25B88E;
  --accent-ink: #6FE7C4;
  --accent-soft: rgba(46,211,163,.13);
  --accent-glow: rgba(46,211,163,.28);

  --paid: #2ED3A3;
  --paid-soft: rgba(46,211,163,.13);
  --pending: #E6B14E;
  --pending-soft: rgba(230,177,78,.14);
  --overdue: #F0697E;
  --overdue-soft: rgba(240,105,126,.14);
  --draft: #8A909B;
  --draft-soft: rgba(138,144,155,.14);

  --chart-1: #2ED3A3;
  --chart-2: #E6B14E;
  --chart-grid: #20242B;

  --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.3);
  --shadow-md: 0 2px 8px -2px rgba(0,0,0,.4), 0 12px 30px -10px rgba(0,0,0,.55);
  --shadow-lg: 0 6px 14px -6px rgba(0,0,0,.5), 0 32px 64px -18px rgba(0,0,0,.7);
  --shadow-accent: 0 8px 26px -6px var(--accent-glow);

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv01";
  overflow: hidden;
}

#root { height: 100vh; }

.font-num {
  font-family: var(--font-display);
  font-feature-settings: "tnum" 1, "lnum" 1;
  letter-spacing: -.01em;
}

::selection { background: var(--accent-soft); color: var(--accent-2); }

/* ---- scrollbars ---- */
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb {
  background: var(--ink-4);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
  opacity: .5;
}
.scroll::-webkit-scrollbar-thumb:hover { background-color: var(--ink-3); background-clip: content-box; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  background: var(--canvas-grad);
  transition: background .5s var(--ease);
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  display: flex;
  flex-direction: column;
  padding: 22px 16px 18px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  position: relative;
  z-index: 20;
  transition: background .5s var(--ease), border-color .5s var(--ease);
}
[data-theme="dark"] .sidebar { background: var(--surface); }

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 6px 8px 4px;
  margin-bottom: 26px;
}
.brand-mark {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(155deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow: 0 6px 16px -4px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  color: #fff;
  flex-shrink: 0;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 21px;
  letter-spacing: -.02em;
  color: var(--ink);
}
.brand-dot { color: var(--accent); }

.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 18px 12px 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  color: var(--ink-2);
  font-size: 14.5px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font-body);
  transition: color .18s var(--ease), background .18s var(--ease);
}
.nav-item svg { flex-shrink: 0; opacity: .85; transition: transform .25s var(--ease); }
.nav-item:hover { background: var(--surface-inset); color: var(--ink); }
.nav-item:hover svg { transform: translateX(1px); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 600;
}
.nav-item.active svg { opacity: 1; }
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -16px; top: 50%;
  transform: translateY(-50%);
  width: 3.5px; height: 22px;
  border-radius: 0 4px 4px 0;
  background: var(--accent);
}
.nav-badge {
  margin-left: auto;
  font-family: var(--font-display);
  font-size: 11.5px;
  font-weight: 700;
  background: var(--overdue);
  color: #fff;
  padding: 1px 7px;
  border-radius: 99px;
  min-width: 20px;
  text-align: center;
}
.nav-item.active .nav-badge { box-shadow: 0 0 0 3px var(--accent-soft); }

.sidebar-spacer { flex: 1; min-height: 18px; }

.upgrade {
  margin-top: 14px;
  border-radius: var(--radius-lg);
  padding: 16px;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.14), transparent 55%),
    linear-gradient(155deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-accent);
}
.upgrade::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(60% 80% at 100% 120%, rgba(255,255,255,.18), transparent 60%);
  pointer-events: none;
}
.upgrade-title { font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.upgrade-sub { font-size: 12.5px; opacity: .85; margin: 4px 0 12px; line-height: 1.4; }
.upgrade-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff; color: var(--accent-2);
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  border: none; border-radius: 9px; padding: 8px 13px; cursor: pointer;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
}
.upgrade-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(0,0,0,.3); }

/* ---------- MAIN COLUMN ---------- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
}

.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--canvas) 72%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  flex-shrink: 0;
  z-index: 15;
  transition: border-color .5s var(--ease);
}

.company-switch {
  display: flex; align-items: center; gap: 11px;
  padding: 7px 12px 7px 8px;
  border-radius: var(--radius-md);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .18s var(--ease), border-color .18s var(--ease);
}
.company-switch:hover { background: var(--surface); border-color: var(--line); }
.company-logo {
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--surface-inset);
  border: 1px solid var(--line);
  font-family: var(--font-display); font-weight: 800; font-size: 14px;
  color: var(--ink);
}
.company-name { font-weight: 600; font-size: 14.5px; color: var(--ink); line-height: 1.15; }
.company-sub { font-size: 12px; color: var(--ink-3); }

.topbar-spacer { flex: 1; }

.search {
  display: flex; align-items: center; gap: 9px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 9px 13px;
  width: 260px;
  color: var(--ink-3);
  font-size: 13.5px;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease), width .25s var(--ease);
  cursor: text;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); width: 300px; }
.search input { border: none; background: none; outline: none; font-family: var(--font-body); font-size: 13.5px; color: var(--ink); width: 100%; }
.search input::placeholder { color: var(--ink-3); }
.search kbd {
  margin-left: auto; font-family: var(--font-display); font-size: 11px; font-weight: 600;
  background: var(--surface-inset); border: 1px solid var(--line); border-radius: 5px;
  padding: 1px 6px; color: var(--ink-3);
}

.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink-2);
  cursor: pointer;
  position: relative;
  transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
}
.icon-btn:hover { color: var(--ink); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.icon-btn .ping {
  position: absolute; top: 9px; right: 10px;
  width: 7px; height: 7px; border-radius: 99px;
  background: var(--overdue);
  border: 2px solid var(--surface);
}

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(155deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  border: none; border-radius: var(--radius-md);
  padding: 11px 17px; cursor: pointer;
  box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
}
.btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 12px 26px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.22); }
.btn-primary:active { transform: translateY(0); }

.avatar {
  width: 40px; height: 40px; border-radius: 11px;
  background: linear-gradient(155deg, #2C3340, #161A21);
  color: #fff; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  cursor: pointer;
  border: 1px solid var(--line);
  transition: transform .18s var(--ease);
}
.avatar:hover { transform: translateY(-1px); }

/* ---------- CONTENT SCROLL AREA ---------- */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 30px 32px 48px;
}

.page-head {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 26px;
}
.page-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 32px;
  letter-spacing: -.025em;
  color: var(--ink);
  line-height: 1.05;
}
.page-sub { font-size: 14.5px; color: var(--ink-3); margin-top: 6px; }
.page-head-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }

/* period segmented control */
.segmented {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 4px;
  gap: 2px;
}
.segmented button {
  border: none; background: none; cursor: pointer;
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  color: var(--ink-3);
  padding: 7px 14px; border-radius: 9px;
  transition: color .18s var(--ease), background .18s var(--ease);
}
.segmented button:hover { color: var(--ink); }
.segmented button.on { background: var(--surface-inset); color: var(--ink); box-shadow: var(--shadow-xs); }
[data-theme="dark"] .segmented button.on { background: var(--surface-2); }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-family: var(--font-body); font-weight: 600; font-size: 13.5px;
  border-radius: var(--radius-md);
  padding: 10px 15px; cursor: pointer;
  transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
}
.btn-ghost:hover { color: var(--ink); transform: translateY(-1px); box-shadow: var(--shadow-sm); }

/* ============================================================
   CARDS / GRID
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: box-shadow .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease), background .5s var(--ease);
}
.card-pad { padding: 22px; }

.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  margin-bottom: var(--gap);
}

/* ---- KPI / stat card ---- */
.stat {
  position: relative;
  overflow: hidden;
  padding: 20px;
  cursor: default;
}
.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.stat-ico {
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center;
}
.stat-ico.green { background: var(--paid-soft); color: var(--paid); }
.stat-ico.amber { background: var(--pending-soft); color: var(--pending); }
.stat-ico.red { background: var(--overdue-soft); color: var(--overdue); }
.stat-ico.ink { background: var(--surface-inset); color: var(--ink); }

.delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-display); font-weight: 700; font-size: 12.5px;
  padding: 3px 8px 3px 6px; border-radius: 99px;
}
.delta.up { background: var(--paid-soft); color: var(--paid); }
.delta.down { background: var(--overdue-soft); color: var(--overdue); }
.delta.flat { background: var(--draft-soft); color: var(--draft); }

.stat-label { font-size: 13.5px; color: var(--ink-3); font-weight: 500; margin-bottom: 7px; }
.stat-value {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  letter-spacing: -.025em;
  color: var(--ink);
  font-feature-settings: "tnum" 1;
  line-height: 1;
}
.stat-value .cur { font-size: 17px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.stat-spark { position: absolute; right: 0; bottom: 0; left: 0; height: 38px; opacity: .9; pointer-events: none; }

/* ---- section card header ---- */
.card-head {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line-2);
}
.card-head h3 { font-family: var(--font-display); font-weight: 700; font-size: 16.5px; letter-spacing: -.01em; color: var(--ink); }
.card-head .hint { font-size: 12.5px; color: var(--ink-3); }
.card-head-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.link {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--accent); font-weight: 600; font-size: 13.5px; cursor: pointer;
  background: none; border: none; font-family: var(--font-body);
  transition: gap .2s var(--ease), color .2s var(--ease);
}
.link:hover { gap: 8px; color: var(--accent-2); }

/* ============================================================
   REVENUE CHART AREA
   ============================================================ */
.chart-wrap { padding: 8px 14px 14px; }
.chart-legend { display: flex; gap: 18px; padding: 0 8px 4px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

.chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--ink);
  color: var(--surface);
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  box-shadow: var(--shadow-lg);
  transform: translate(-50%, -118%);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .15s var(--ease);
  z-index: 5;
}
.chart-tooltip.show { opacity: 1; }
.chart-tooltip .tt-month { color: var(--ink-3); font-size: 11px; margin-bottom: 3px; }
[data-theme="dark"] .chart-tooltip { background: #fff; color: #15171C; }
[data-theme="dark"] .chart-tooltip .tt-month { color: #585E68; }
.chart-tooltip b { font-family: var(--font-display); font-weight: 700; }

/* ============================================================
   DONUT / STATUS
   ============================================================ */
.donut-row { display: flex; align-items: center; gap: 24px; padding: 8px 6px; }
.donut-legend { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.dleg { display: flex; align-items: center; gap: 11px; }
.dleg .sw { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0; }
.dleg .l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.dleg .v { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink); }

/* ============================================================
   TABLE / INVOICE LIST
   ============================================================ */
.tbl { width: 100%; border-collapse: collapse; }
.tbl thead th {
  text-align: left;
  font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3);
  padding: 12px 22px;
  border-bottom: 1px solid var(--line-2);
}
.tbl thead th.right { text-align: right; }
.tbl tbody td { padding: 14px 22px; border-bottom: 1px solid var(--line-2); font-size: 14px; color: var(--ink-2); }
.tbl tbody tr { transition: background .15s var(--ease); cursor: pointer; }
.tbl tbody tr:hover { background: var(--surface-inset); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl td.right { text-align: right; }

.client-cell { display: flex; align-items: center; gap: 12px; }
.client-ava {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 13.5px;
  color: #fff; flex-shrink: 0;
}
.client-name { font-weight: 600; color: var(--ink); font-size: 14px; }
.client-meta { font-size: 12px; color: var(--ink-3); }
.inv-num { font-family: var(--font-display); font-weight: 600; color: var(--ink); font-feature-settings: "tnum" 1; }
.amount { font-family: var(--font-display); font-weight: 700; color: var(--ink); font-feature-settings: "tnum" 1; }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600;
  padding: 4px 10px 4px 8px; border-radius: 99px;
}
.badge .bdot { width: 6px; height: 6px; border-radius: 99px; }
.badge.paid { background: var(--paid-soft); color: var(--paid); }
.badge.paid .bdot { background: var(--paid); }
.badge.pending { background: var(--pending-soft); color: var(--pending); }
.badge.pending .bdot { background: var(--pending); }
.badge.overdue { background: var(--overdue-soft); color: var(--overdue); }
.badge.overdue .bdot { background: var(--overdue); }
.badge.draft { background: var(--draft-soft); color: var(--draft); }
.badge.draft .bdot { background: var(--draft); }

/* ---- client list rows ---- */
.clist { display: flex; flex-direction: column; }
.crow {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 22px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
  transition: background .15s var(--ease);
}
.crow:hover { background: var(--surface-inset); }
.crow:last-child { border-bottom: none; }
.crow .cbar-track { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-inset); overflow: hidden; }
.crow .cbar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }

/* progress / goal */
.goal-ring-wrap { display: flex; align-items: center; gap: 20px; }
.goal-meta .l { font-size: 13px; color: var(--ink-3); }
.goal-meta .v { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--ink); letter-spacing: -.02em; }

/* ---- mini cost rows ---- */
.cost-row { display:flex; align-items:center; gap:13px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.cost-row:last-child { border-bottom: none; }
.cost-ico { width: 38px; height:38px; border-radius:10px; display:grid; place-items:center; background:var(--surface-inset); color:var(--ink-2); flex-shrink:0; }
.cost-name { font-weight:600; font-size:13.5px; color:var(--ink); }
.cost-cat { font-size:12px; color:var(--ink-3); }

/* ============================================================
   ENTRANCE ANIMATIONS
   ============================================================ */
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.reveal { opacity: 0; animation: rise .62s var(--ease-out) forwards; }

@media (prefers-reduced-motion: reduce) {
  .reveal { animation: none; opacity: 1; }
  * { transition: none !important; }
}

/* page transition */
.page { animation: fade .3s var(--ease) both; }

/* ============================================================
   SETTINGS PLACEHOLDER (for non-built pages)
   ============================================================ */
.placeholder-page {
  display: grid; place-items: center; height: 60vh; text-align: center;
}
.placeholder-page .pico {
  width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-3);
  margin: 0 auto 20px; box-shadow: var(--shadow-sm);
}
.placeholder-page h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
.placeholder-page p { color: var(--ink-3); font-size: 14.5px; max-width: 340px; line-height: 1.5; }

/* table toolbar (faktury) */
.toolbar { display:flex; align-items:center; gap:10px; margin-bottom: var(--gap); flex-wrap: wrap; }
.filter-tabs { display:inline-flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:4px; }
.filter-tabs button { border:none; background:none; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--ink-3); padding:7px 13px; border-radius:9px; display:inline-flex; align-items:center; gap:7px; transition: all .18s var(--ease); }
.filter-tabs button:hover { color:var(--ink); }
.filter-tabs button.on { background:var(--surface-inset); color:var(--ink); box-shadow:var(--shadow-xs); }
.filter-tabs button .cnt { font-family:var(--font-display); font-size:11px; background:var(--surface-inset); padding:0 6px; border-radius:99px; color:var(--ink-3); }
.filter-tabs button.on .cnt { background:var(--accent-soft); color:var(--accent-ink); }
[data-theme="dark"] .filter-tabs button.on { background: var(--surface-2); }

/* stats screen big numbers row */
.stats-hero { display:grid; grid-template-columns: 1.6fr 1fr; gap: var(--gap); margin-bottom: var(--gap); }

/* bars chart */
.bars-wrap { padding: 12px 18px 6px; }

</style>

<script type="text/babel" data-src="charts.jsx">
/* ============================================================
   FAKTURINA — animated SVG charts
   ============================================================ */
const { useState, useEffect, useRef, useMemo } = React;

/* ---- helpers ---- */
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const t = 0.18;
    const c1x = p1.x + (p2.x - p0.x) * t;
    const c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t;
    const c2y = p2.y - (p3.y - p1.y) * t;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}

/* =========================================================
   Sparkline — tiny area inside KPI cards
   ========================================================= */
function Sparkline({ data, tone = 'green', play }) {
  const W = 240, H = 44;
  const min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => ({
    x: (i / (data.length - 1)) * W,
    y: H - 4 - ((v - min) / (max - min || 1)) * (H - 10),
  }));
  const line = smoothPath(pts);
  const area = `${line} L ${W} ${H} L 0 ${H} Z`;
  const color = tone === 'red' ? 'var(--overdue)' : tone === 'amber' ? 'var(--pending)' : 'var(--paid)';
  const uid = useMemo(() => 'sp' + Math.random().toString(36).slice(2, 7), []);
  const lineRef = useRef(null);
  useEffect(() => {
    if (!play || !lineRef.current) return;
    const len = lineRef.current.getTotalLength();
    lineRef.current.style.strokeDasharray = len;
    lineRef.current.style.strokeDashoffset = len;
    lineRef.current.getBoundingClientRect();
    lineRef.current.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1) .25s';
    lineRef.current.style.strokeDashoffset = '0';
  }, [play]);
  return (
    <svg className="stat-spark" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id={uid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={color} stopOpacity="0.16" />
          <stop offset="1" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${uid})`} style={{ opacity: play ? 1 : 0, transition: 'opacity .8s ease .5s' }} />
      <path ref={lineRef} d={line} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

/* =========================================================
   RevenueChart — big area chart w/ grid + hover tooltip
   ========================================================= */
function RevenueChart({ revenue, expenses, months, play, showExpenses = true }) {
  const W = 760, H = 280;
  const padT = 18, padB = 34, padL = 6, padR = 6;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const max = Math.max(...revenue, ...(showExpenses ? expenses : [0])) * 1.12;
  const xy = (arr) => arr.map((v, i) => ({
    x: padL + (i / (arr.length - 1)) * innerW,
    y: padT + innerH - (v / max) * innerH,
    v, i,
  }));
  const rp = xy(revenue), ep = xy(expenses);
  const rLine = smoothPath(rp), eLine = smoothPath(ep);
  const rArea = `${rLine} L ${rp[rp.length-1].x} ${padT+innerH} L ${rp[0].x} ${padT+innerH} Z`;

  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const rRef = useRef(null), eRef = useRef(null);

  useEffect(() => {
    if (!play) return;
    [rRef.current, eRef.current].forEach((el, k) => {
      if (!el) return;
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.getBoundingClientRect();
      el.style.transition = `stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1) ${0.15 + k*0.12}s`;
      el.style.strokeDashoffset = '0';
    });
  }, [play, showExpenses]);

  const gridVals = [0, 0.25, 0.5, 0.75, 1];

  function onMove(e) {
    const rect = wrapRef.current.getBoundingClientRect();
    const rel = (e.clientX - rect.left) / rect.width;
    const idx = Math.round(rel * (revenue.length - 1));
    const i = Math.max(0, Math.min(revenue.length - 1, idx));
    setHover(i);
  }

  return (
    <div className="chart-wrap">
      <div className="chart-legend">
        <span className="legend-item"><span className="legend-dot" style={{background:'var(--chart-1)'}}></span>Příjmy</span>
        {showExpenses && <span className="legend-item"><span className="legend-dot" style={{background:'var(--chart-2)'}}></span>Náklady</span>}
      </div>
      <div ref={wrapRef} style={{ position:'relative' }}
           onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', display:'block', overflow:'visible' }}>
          <defs>
            <linearGradient id="revFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stopColor="var(--chart-1)" stopOpacity="0.22" />
              <stop offset="0.7" stopColor="var(--chart-1)" stopOpacity="0.04" />
              <stop offset="1" stopColor="var(--chart-1)" stopOpacity="0" />
            </linearGradient>
          </defs>
          {/* grid */}
          {gridVals.map((g, k) => (
            <line key={k} x1={padL} x2={W-padR}
                  y1={padT + innerH - g*innerH} y2={padT + innerH - g*innerH}
                  stroke="var(--chart-grid)" strokeWidth="1" strokeDasharray={k===0?'0':'4 5'} />
          ))}
          {/* area */}
          <path d={rArea} fill="url(#revFill)" style={{ opacity: play?1:0, transition:'opacity 1s ease .5s' }} />
          {/* expenses line */}
          {showExpenses && (
            <path ref={eRef} d={eLine} fill="none" stroke="var(--chart-2)" strokeWidth="2.4"
                  strokeLinecap="round" strokeDasharray="1 6" style={{ strokeDasharray:'2 7' }} opacity="0.9" />
          )}
          {/* revenue line */}
          <path ref={rRef} d={rLine} fill="none" stroke="var(--chart-1)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
          {/* dots */}
          {rp.map((p, i) => (
            <circle key={i} cx={p.x} cy={p.y} r={hover===i?5:0} fill="var(--surface)" stroke="var(--chart-1)" strokeWidth="3"
                    style={{ transition:'r .18s var(--ease)' }} />
          ))}
          {/* hover crosshair */}
          {hover!=null && (
            <line x1={rp[hover].x} x2={rp[hover].x} y1={padT} y2={padT+innerH}
                  stroke="var(--chart-1)" strokeWidth="1.4" strokeDasharray="4 4" opacity="0.4" />
          )}
          {/* x labels */}
          {months.map((m, i) => (
            <text key={i} x={rp[i].x} y={H-10} textAnchor="middle"
                  fontSize="11" fontFamily="var(--font-body)" fontWeight="500"
                  fill={hover===i ? 'var(--ink)' : 'var(--ink-3)'}>{m}</text>
          ))}
        </svg>
        {hover!=null && (
          <div className={'chart-tooltip show'} style={{
            left: `${(rp[hover].x/W)*100}%`,
            top: `${(rp[hover].y/H)*100}%`,
          }}>
            <div className="tt-month">{months[hover]} 2026</div>
            <div><span style={{color:'var(--chart-1)'}}>●</span> Příjmy <b>{fmtCZ(revenue[hover])} Kč</b></div>
            {showExpenses && <div style={{marginTop:2}}><span style={{color:'var(--chart-2)'}}>●</span> Náklady <b>{fmtCZ(expenses[hover])} Kč</b></div>}
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================
   Donut — invoice status split
   ========================================================= */
function Donut({ segments, play, total, centerLabel = 'faktur', size = 168 }) {
  const r = size/2 - 14, cx = size/2, cy = size/2, C = 2 * Math.PI * r;
  const sum = segments.reduce((a, s) => a + s.value, 0);
  let acc = 0;
  const arcs = segments.map((s) => {
    const frac = s.value / sum;
    const dash = frac * C;
    const arc = { ...s, dash, gap: C - dash, offset: -acc * C, frac };
    acc += frac;
    return arc;
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-inset)" strokeWidth="14" />
      {arcs.map((a, i) => (
        <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={a.color} strokeWidth="14"
                strokeLinecap="round"
                strokeDasharray={`${play ? a.dash : 0} ${C}`}
                strokeDashoffset={a.offset}
                transform={`rotate(-90 ${cx} ${cy})`}
                style={{ transition:`stroke-dasharray 1.1s cubic-bezier(.16,1,.3,1) ${0.2 + i*0.12}s` }} />
      ))}
      <text x={cx} y={cy-4} textAnchor="middle" fontFamily="var(--font-display)" fontWeight="800"
            fontSize="30" fill="var(--ink)" style={{letterSpacing:'-.02em'}}>{total}</text>
      <text x={cx} y={cy+18} textAnchor="middle" fontFamily="var(--font-body)" fontWeight="500"
            fontSize="13" fill="var(--ink-3)">{centerLabel}</text>
    </svg>
  );
}

/* =========================================================
   GoalRing — circular progress
   ========================================================= */
function GoalRing({ pct, play, size = 132, label }) {
  const r = size/2 - 12, cx = size/2, cy = size/2, C = 2*Math.PI*r;
  const dash = (play ? pct/100 : 0) * C;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <defs>
        <linearGradient id="goalGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor="var(--accent-2)" />
          <stop offset="1" stopColor="var(--accent)" />
        </linearGradient>
      </defs>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-inset)" strokeWidth="11" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="url(#goalGrad)" strokeWidth="11" strokeLinecap="round"
              strokeDasharray={`${dash} ${C}`} transform={`rotate(-90 ${cx} ${cy})`}
              style={{ transition:'stroke-dasharray 1.3s cubic-bezier(.16,1,.3,1) .3s' }} />
      <text x={cx} y={cy-2} textAnchor="middle" fontFamily="var(--font-display)" fontWeight="800"
            fontSize="28" fill="var(--ink)" style={{letterSpacing:'-.02em'}}>{Math.round(pct)}%</text>
      <text x={cx} y={cy+18} textAnchor="middle" fontFamily="var(--font-body)" fontWeight="500"
            fontSize="11.5" fill="var(--ink-3)">{label}</text>
    </svg>
  );
}

/* =========================================================
   Bars — monthly comparison bars (stats page)
   ========================================================= */
function Bars({ revenue, expenses, months, play }) {
  const W = 760, H = 280, padB = 30, padT = 14;
  const innerH = H - padB - padT;
  const max = Math.max(...revenue) * 1.1;
  const n = revenue.length;
  const slot = W / n;
  const bw = 13;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', display:'block' }}>
      {[0.25,0.5,0.75,1].map((g,k)=>(
        <line key={k} x1="0" x2={W} y1={padT+innerH-g*innerH} y2={padT+innerH-g*innerH}
              stroke="var(--chart-grid)" strokeWidth="1" strokeDasharray="4 5" />
      ))}
      {revenue.map((v, i) => {
        const cx = slot*i + slot/2;
        const rh = (v/max)*innerH;
        const eh = (expenses[i]/max)*innerH;
        return (
          <g key={i}>
            <rect x={cx-bw-1} y={padT+innerH-(play?rh:0)} width={bw} height={play?rh:0} rx="4"
                  fill="var(--chart-1)" style={{ transition:`all .9s cubic-bezier(.16,1,.3,1) ${i*0.045}s` }} />
            <rect x={cx+1} y={padT+innerH-(play?eh:0)} width={bw} height={play?eh:0} rx="4"
                  fill="var(--chart-2)" opacity="0.65" style={{ transition:`all .9s cubic-bezier(.16,1,.3,1) ${i*0.045+0.05}s` }} />
            <text x={cx} y={H-9} textAnchor="middle" fontSize="11" fontWeight="500"
                  fontFamily="var(--font-body)" fill="var(--ink-3)">{months[i]}</text>
          </g>
        );
      })}
    </svg>
  );
}

Object.assign(window, { Sparkline, RevenueChart, Donut, GoalRing, Bars, smoothPath });

/* ============================================================

const { useState: useStateU, useEffect: useEffectU, useRef: useRefU } = React;

/* ---- animated count-up number ---- */
function useCountUp(target, play, dur = 1400) {
  const [val, setVal] = useStateU(0);
  const ref = useRefU();
  useEffectU(() => {
    if (!play) { setVal(0); return; }
    let start;
    const from = 0;
    cancelAnimationFrame(ref.current);
    const tick = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(from + (target - from) * eased);
      if (p < 1) ref.current = requestAnimationFrame(tick);
    };
    ref.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(ref.current);
  }, [target, play]);
  return val;
}

function CountNum({ value, play, cur, dur }) {
  const v = useCountUp(value, play, dur);
  return (
    <span>{fmtCZ(Math.round(v))}{cur && <span className="cur">{cur}</span>}</span>

}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────

    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-src="app.jsx">
/* ============================================================
   FAKTURINA — app shell, routing, theme, tweaks
   ============================================================ */
const { useState: useSt, useEffect: useEf } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "accent": "emerald",
  "density": "Střední"
}/*EDITMODE-END*/;

const ACCENTS = {
  emerald: { l:['#0E7C5A','#0A6347','#0B5C43','#E2F1EA','rgba(14,124,90,.18)'], d:['#2ED3A3','#25B88E','#6FE7C4','rgba(46,211,163,.13)','rgba(46,211,163,.28)'] },
  indigo:  { l:['#5B53E8','#473FCB','#3F38B0','#E9E7FB','rgba(91,83,232,.20)'], d:['#8E86FA','#7A71F0','#B4AEFC','rgba(142,134,250,.15)','rgba(142,134,250,.30)'] },
  cobalt:  { l:['#2563EB','#1D4FD0','#1B45B5','#E2ECFD','rgba(37,99,235,.20)'], d:['#5B92F5','#3F78ED','#9CC0FB','rgba(91,146,245,.15)','rgba(91,146,245,.30)'] },
  plum:    { l:['#9A3D8E','#7F2F76','#6E2867','#F6E7F3','rgba(154,61,142,.20)'], d:['#D173C4','#BE5BB0','#E6AEDD','rgba(209,115,196,.15)','rgba(209,115,196,.30)'] },
};
const DENSITY = { 'Kompaktní': '14px', 'Střední': '20px', 'Vzdušné': '28px' };

function applyTheme(t) {
  const root = document.documentElement;
  root.setAttribute('data-theme', t.dark ? 'dark' : 'light');
  const a = (ACCENTS[t.accent] || ACCENTS.emerald)[t.dark ? 'd' : 'l'];
  root.style.setProperty('--accent', a[0]);
  root.style.setProperty('--accent-2', a[1]);
  root.style.setProperty('--accent-ink', t.dark ? a[2] : a[2]);
  root.style.setProperty('--accent-soft', a[3]);
  root.style.setProperty('--accent-glow', a[4]);
  root.style.setProperty('--chart-1', a[0]);
  root.style.setProperty('--gap', DENSITY[t.density] || DENSITY.regular);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useSt('dashboard');
  const [play, setPlay] = useSt(false);

  useEf(() => { applyTheme(t); }, [t.dark, t.accent, t.density]);

  // replay entrance animations on every navigation
  useEf(() => {
    setPlay(false);
    let r2;
    const r1 = requestAnimationFrame(() => { r2 = requestAnimationFrame(() => setPlay(true)); });
    return () => { cancelAnimationFrame(r1); cancelAnimationFrame(r2); };
  }, [route]);

  let Screen;
  if (route === 'dashboard') Screen = <Dashboard play={play} />;
  else if (route === 'invoices') Screen = <Invoices play={play} />;
  else if (route === 'stats') Screen = <Stats play={play} />;
  else Screen = <Placeholder route={route} />;

  return (
    <div className="app">
      <Sidebar route={route} setRoute={setRoute} />
      <div className="main">
        <TopBar dark={t.dark} onToggleTheme={() => setTweak('dark', !t.dark)} />
        <div className="content scroll" key={route}>
          {Screen}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Vzhled" />
        <TweakToggle label="Tmavý režim" value={t.dark} onChange={(v)=>setTweak('dark', v)} />
        <TweakColor label="Akcent" value={(ACCENTS[t.accent]||ACCENTS.emerald).l[0]}
          options={[ACCENTS.emerald.l[0], ACCENTS.indigo.l[0], ACCENTS.cobalt.l[0], ACCENTS.plum.l[0]]}
          onChange={(hex)=>{
            const key = Object.keys(ACCENTS).find(k=>ACCENTS[k].l[0]===hex) || 'emerald';
            setTweak('accent', key);
          }} />
        <TweakSection label="Rozložení" />
        <TweakRadio label="Hustota" value={t.density} options={['Kompaktní','Střední','Vzdušné']}
          onChange={(v)=>setTweak('density', v)} />
      </TweaksPanel>
    </div>
  );
}

// initial paint with correct theme before React mounts
applyTheme(TWEAK_DEFAULTS);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
