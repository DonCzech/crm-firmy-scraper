<svg xmlns="http://www.w3.org/2000/svg" width="252" height="60" viewBox="0 0 252 60" role="img" aria-labelledby="vk-title">
  <title id="vk-title">Vlna kávy — pražírna a kavárna</title>
  <defs>
    <linearGradient id="vk-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7cf"/>
      <stop offset="1" stop-color="#e9c9a6"/>
    </linearGradient>
  </defs>
  <!-- Monogram roundel -->
  <g transform="translate(30 30)">
    <circle r="27" fill="none" stroke="url(#vk-ring)" stroke-width="1.6"/>
    <circle r="22.5" fill="none" stroke="#ff8aa3" stroke-width="0.8" opacity="0.6"/>
    <!-- steam waves -->
    <path d="M-9 -11 q4.5 -5 9 0 q4.5 5 9 0" fill="none" stroke="#f6e7cf" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M-6 -6 q3 -3.5 6 0 q3 3.5 6 0" fill="none" stroke="#ff8aa3" stroke-width="1.4" stroke-linecap="round"/>
    <!-- cup -->
    <path d="M-11 1 h22 v3 a11 11 0 0 1 -22 0 z" fill="#f6e7cf"/>
    <path d="M11 2 h3.5 a3.5 3.5 0 0 1 0 7 h-2.2" fill="none" stroke="#f6e7cf" stroke-width="1.7" stroke-linecap="round"/>
    <!-- saucer -->
    <rect x="-13" y="14.5" width="26" height="2.2" rx="1.1" fill="#f6e7cf" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <text x="70" y="30" fill="#f6e7cf" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="1.5">Vlna kávy</text>
  <g>
    <line x1="70" y1="41" x2="83" y2="41" stroke="#ff8aa3" stroke-width="1"/>
    <text x="88" y="45" fill="#e9c9a6" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.2">PRAŽÍRNA · KAVÁRNA</text>
  </g>
</svg>
