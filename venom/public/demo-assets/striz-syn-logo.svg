<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Stříž &amp; Syn">
  <defs>
    <style>
      .wm { font-family: 'Bebas Neue', 'Oswald', Impact, sans-serif; font-weight: 400; letter-spacing: 0.14em; }
      .sub { font-family: 'Open Sans', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.40em; }
    </style>
  </defs>
  <!-- scissors icon left -->
  <g transform="translate(22,34) rotate(-30)" stroke="#d5b981" stroke-width="1.4" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="14" y2="14"/>
    <line x1="0" y1="14" x2="14" y2="0"/>
    <circle cx="0" cy="0" r="3.5" fill="#d5b981" stroke="none"/>
    <circle cx="0" cy="14" r="3.5" fill="#d5b981" stroke="none"/>
  </g>
  <!-- top line -->
  <line x1="50" y1="20" x2="270" y2="20" stroke="#d5b981" stroke-width="1"/>
  <!-- main wordmark -->
  <text x="160" y="50" text-anchor="middle" class="wm" fill="#d5b981" font-size="28">STŘÍŽ &amp; SYN</text>
  <!-- sub label -->
  <text x="160" y="68" text-anchor="middle" class="sub" fill="#d5b981" font-size="8.5" opacity="0.85">BARBERSHOP &#8226; BRNO</text>
  <!-- bottom line -->
  <line x1="50" y1="76" x2="270" y2="76" stroke="#d5b981" stroke-width="1"/>
</svg>
