<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="286" height="73">
  <!-- Icon: stylized person in motion with green cross accent -->
  <g transform="translate(4, 4)">
    <!-- Body circle (head) -->
    <circle cx="24" cy="8" r="6" fill="#1f2d69"/>
    <!-- Torso -->
    <path d="M24 14 L20 28 L24 24 L28 28 L24 14Z" fill="#1f2d69"/>
    <!-- Arms spread (physiotherapy motion) -->
    <path d="M12 20 Q18 16 24 18 Q30 16 36 20" stroke="#1f2d69" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M20 28 L16 42" stroke="#1f2d69" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 28 L32 42" stroke="#1f2d69" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Green medical plus accent (top right of figure) -->
    <rect x="32" y="2" width="12" height="3.5" rx="1.75" fill="#10d15d"/>
    <rect x="36.25" y="-2" width="3.5" height="12" rx="1.75" fill="#10d15d"/>
  </g>

  <!-- Text: VAŠE -->
  <text x="60" y="22" font-family="Montserrat, Open Sans, sans-serif" font-size="11" font-weight="600" fill="#6bbea1" letter-spacing="3">VAŠE</text>

  <!-- Text: Fyzio (bold, navy) -->
  <text x="58" y="45" font-family="Montserrat, Open Sans, sans-serif" font-size="26" font-weight="800" fill="#1f2d69" letter-spacing="0.5">Fyzio</text>

  <!-- Green underline accent -->
  <rect x="58" y="50" width="80" height="3" rx="1.5" fill="#10d15d"/>
</svg>
