<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#2a1f0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Subtle cross-hatch texture -->
  <rect width="1920" height="1080" fill="none" stroke="#BF8A1D" stroke-width="0.3" opacity="0.04"
    style="background-image: repeating-linear-gradient(0deg, transparent, transparent 40px, #BF8A1D 40px, #BF8A1D 41px)"/>
  <!-- Vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
  <!-- Gold accent glow top center -->
  <ellipse cx="960" cy="200" rx="400" ry="180" fill="#BF8A1D" opacity="0.04"/>
</svg>
