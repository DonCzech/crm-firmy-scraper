<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 60" width="248" height="60" role="img" aria-label="Apex Autoservis">
  <!-- Icon: orange circle badge with white A -->
  <circle cx="30" cy="30" r="27" fill="#FFA500"/>
  <text x="30" y="30" text-anchor="middle" dominant-baseline="central"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="27" font-weight="900" fill="#ffffff">A</text>

  <!-- Wordmark (light variant for dark backgrounds) -->
  <text x="70" y="27"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26" font-weight="900" fill="#ffffff" letter-spacing="-0.5">APEX</text>
  <rect x="70" y="33" width="90" height="2.5" fill="#FFA500" rx="1"/>
  <text x="70" y="51"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="4">AUTOSERVIS</text>
</svg>
