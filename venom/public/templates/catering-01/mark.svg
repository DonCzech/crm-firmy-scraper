<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="Saveur & Co.">
  <defs>
    <style>
      .brand  { font-family: 'Fraunces', 'Playfair Display', Georgia, serif; font-weight: 400; font-style: italic; fill: #2d4a3e; letter-spacing: 0.005em; }
      .amp    { font-family: 'Fraunces', 'Playfair Display', Georgia, serif; font-weight: 300; font-style: italic; fill: #c4755b; }
      .tag    { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 0.32em; fill: #2d4a3e; }
      .stem   { stroke: #2d4a3e; stroke-width: 1.1; fill: none; stroke-linecap: round; }
      .leaf   { fill: #2d4a3e; }
      .berry  { fill: #c4755b; }
    </style>
  </defs>

  <g transform="translate(6,8)">
    <circle cx="28" cy="28" r="27" fill="none" stroke="#2d4a3e" stroke-width="0.8" opacity="0.28"/>
    <path class="stem" d="M12 44 Q28 28 44 12" />
    <ellipse class="leaf" cx="18" cy="38" rx="5.2" ry="2.1" transform="rotate(-40 18 38)"/>
    <ellipse class="leaf" cx="24" cy="32" rx="5.2" ry="2.1" transform="rotate(-40 24 32)"/>
    <ellipse class="leaf" cx="30" cy="26" rx="5.2" ry="2.1" transform="rotate(-40 30 26)"/>
    <ellipse class="leaf" cx="36" cy="20" rx="5.2" ry="2.1" transform="rotate(-40 36 20)"/>
    <ellipse class="leaf" cx="22" cy="24" rx="4.4" ry="1.9" transform="rotate(50 22 24)"/>
    <ellipse class="leaf" cx="30" cy="18" rx="4.4" ry="1.9" transform="rotate(50 30 18)"/>
    <circle class="berry" cx="20" cy="34" r="1.5"/>
    <circle class="berry" cx="28" cy="26" r="1.5"/>
    <circle class="berry" cx="36" cy="18" r="1.5"/>
  </g>

  <text x="78" y="38" class="brand" font-size="28">Saveur <tspan class="amp" font-size="30">&amp;</tspan> Co.</text>
  <text x="80" y="58" class="tag" font-size="8.5">FINE-DINE CATERING · PRAHA</text>
</svg>
