name: Venom PageSpeed Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/venom-pagespeed-audit.yml"
  schedule:
    # Four small batches per day. Times are UTC; exact Prague wall time shifts
    # with daylight saving, which does not affect queue correctness.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "Number of PSI URL/strategy measurements in this batch"
        required: false
        default: "8"
      force_new_cycle:
        description: "Start a new full cycle even if the last one is under 30 days old"
        type: boolean
        required: false
        default: false

concurrency:
  group: venom-pagespeed-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    working-directory: venom

jobs:
  audit-batch:
    name: Collect and aggregate PSI batch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.VENOM_DATABASE_URL || secrets.DATABASE_URL }}
      GOOGLE_PSI_KEY: ${{ secrets.GOOGLE_PSI_KEY }}
      PAGESPEED_BASE_URL: https://webero.co
      PAGESPEED_BATCH_LIMIT: ${{ inputs.batch_limit || '8' }}
      PAGESPEED_MIN_CYCLE_DAYS: "30"
      PAGESPEED_MAX_TARGET_ATTEMPTS: "4"
      PAGESPEED_REQUEST_DELAY_MS: "2500"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: venom/package-lock.json

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing GitHub Actions secret VENOM_DATABASE_URL (or DATABASE_URL)." >&2
            exit 1
          fi
          if [ -z "$GOOGLE_PSI_KEY" ]; then
            echo "Missing GitHub Actions secret GOOGLE_PSI_KEY." >&2
            exit 1
          fi

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Run the next PageSpeed batch
        id: batch
        shell: bash
        run: |
          args=(batch --limit="$PAGESPEED_BATCH_LIMIT")
          if [ "${{ inputs.force_new_cycle || false }}" = "true" ]; then
            args+=(--force-new)
          fi
          node scripts/pagespeed-audit.mjs "${args[@]}"

      - name: Add current report to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/pagespeed/report.md ]; then
            sed -n '1,260p' artifacts/pagespeed/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload batch evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venom-pagespeed-run-${{ steps.batch.outputs.run_id || github.run_id }}-batch-${{ github.run_number }}
          path: |
            venom/artifacts/pagespeed/report.md
            venom/artifacts/pagespeed/report.json
            venom/artifacts/pagespeed/raw/**/*.json.gz
          if-no-files-found: warn
          retention-days: 90

      - name: Publish completed audit as a GitHub issue
        if: steps.batch.outputs.completed_now == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: venom/artifacts/pagespeed/report.md
          AUDIT_RUN_ID: ${{ steps.batch.outputs.run_id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- venom-pagespeed-audit -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report}`.slice(0, 65000);
            const title = `Venom PageSpeed audit #${process.env.AUDIT_RUN_ID} — dokončeno`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
