name: Firmy.cz Scrape

on:
  # ROZVRH ODSTRANĚN 8. 8. 2026 (WP-12, docs/NEON_OPTIMALIZACE_PLAN.md).
  # Byl to DRUHÝ spouštěč téhož endpointu — `backend/vercel.json` volá
  # /api/cron/firmy-scrape každou hodinu v :15. Dvojí rozvrh znamenal jen dvojí
  # probouzení FIRMY databáze (~5,5 min za probuzení), ne víc nasbíraných dat:
  # frontu URL naplní `firmy-refresh-sitemaps` jednou denně ve 03:00 a hodinové
  # běhy ji vyprázdní během dopoledne — zbytek dne vracely oba spouštěče
  # scraped=0. Ruční spuštění přes workflow_dispatch zůstává.
  workflow_dispatch:
    inputs:
      budget:
        # Strop je maxDuration 300 s z backend/vercel.json a musí v něm zbýt
        # místo na studený boot lambdy. S 290 končila část běhů na 504
        # FUNCTION_INVOCATION_TIMEOUT (4 z 60 běhů do 8. 8. 2026); vercelovský
        # cron proto jezdí na 240.
        description: 'Budget in seconds (max 240)'
        required: false
        default: '240'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call firmy-scrape cron
        run: |
          BUDGET="${{ github.event.inputs.budget || '240' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://crm-api-dons-projects-c78c9c27.vercel.app/api/cron/firmy-scrape?budget=${BUDGET}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "ERROR: Unexpected HTTP status $HTTP_CODE"
            exit 1
          fi
