name: Venom CI

on:
  push:
    branches: [main]
    paths:
      - "venom/**"
  pull_request:
    paths:
      - "venom/**"

defaults:
  run:
    working-directory: venom

jobs:
  lint-and-check:
    name: Lint + TS check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: venom/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint --silent
        continue-on-error: true

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

  residue-check:
    name: Residue regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan changed template files for residues
        run: |
          # Determine base ref (main on push, base branch on PR)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch origin "$BASE"
            BASE_SHA=$(git merge-base HEAD "origin/$BASE")
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # Stage changed template files for the precommit script to detect
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- 'venom/src/templates/**/content/cs.json' 'venom/src/templates/**/skin.css' || true)
          if [ -z "$CHANGED" ]; then
            echo "No template content changes — skipping residue check"
            exit 0
          fi
          echo "Changed template files:"
          echo "$CHANGED"

          # Stage them so the precommit script (which reads `git diff --cached`) sees them
          git -C .. config user.email "ci@webero.co"
          git -C .. config user.name "venom-ci"
          # Reset to base then re-apply working tree changes from HEAD as staged
          git -C .. reset --soft "$BASE_SHA"
          git -C .. add $CHANGED

          # Run the gate
          node venom/scripts/precommit-residue-check.mjs

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint-and-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: venom/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://webero.co
          # No DB connection in CI — build should still succeed for static analysis
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub?sslmode=disable
        continue-on-error: true
