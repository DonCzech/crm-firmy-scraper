<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmy</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #222;
      --text: #e5e5e5;
      --muted: #888;
      --accent: #e50914;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    #search {
      flex: 1;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search:focus { border-color: #444; }
    #search::placeholder { color: var(--muted); }

    #count {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── GRID ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      user-select: none;
    }

    .card:hover {
      border-color: #444;
      transform: translateY(-2px);
    }

    .card:active { transform: translateY(0); }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
    }

    #empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── PLAYER OVERLAY ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.96);
      flex-direction: column;
    }

    #overlay.active { display: flex; }

    #overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #overlay-title {
      font-size: 16px;
      font-weight: 600;
    }

    #close-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.15s;
    }

    #close-btn:hover { border-color: #555; }

    #player-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #player {
      width: 100%;
      max-width: 1200px;
      max-height: calc(100vh - 100px);
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 6px;
    }

    #player-error {
      display: none;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>▶ Filmy</h1>
  <input id="search" type="search" placeholder="Hledat film nebo seriál..." autofocus>
  <span id="count"></span>
</header>

<div id="grid"></div>

<!-- Player overlay -->
<div id="overlay">
  <div id="overlay-header">
    <span id="overlay-title"></span>
    <button id="close-btn">✕ Zavřít &nbsp;<small style="opacity:.5">Esc</small></button>
  </div>
  <div id="player-wrap">
    <video id="player" controls autoplay></video>
    <div id="player-error">Nepodařilo se načíst stream. Zkontroluj URL v movies.json.</div>
  </div>
</div>

<script>
  let movies = [];
  let hlsInstance = null;

  // Load movies.json
  fetch('movies.json')
    .then(r => r.json())
    .then(data => {
      movies = data;
      render(movies);
    })
    .catch(() => {
      document.getElementById('grid').innerHTML =
        '<div id="empty">Nelze načíst movies.json. Spusť přes HTTP server (npx serve .).</div>';
    });

  function render(list) {
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    count.textContent = list.length + ' filmů';

    if (!list.length) {
      grid.innerHTML = '<div id="empty">Žádné výsledky</div>';
      return;
    }

    grid.innerHTML = list.map((m, i) => `
      <div class="card" data-index="${i}" onclick="play(${i})">
        <div class="card-title">${escape(m.title)}</div>
        <div class="card-meta">${[m.year, m.genre].filter(Boolean).join(' · ')}</div>
      </div>
    `).join('');
  }

  // Search — live filter
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { render(movies); return; }
    render(movies.filter(m => m.title.toLowerCase().includes(q)));
  });

  // Play
  function play(index) {
    const m = movies[index];
    if (!m) return;

    const overlay = document.getElementById('overlay');
    const video = document.getElementById('player');
    const errBox = document.getElementById('player-error');
    const title = document.getElementById('overlay-title');

    title.textContent = m.title;
    errBox.style.display = 'none';
    video.style.display = 'block';
    overlay.classList.add('active');

    // Destroy previous HLS instance
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    video.src = '';

    const url = m.url;
    const isHls = url.includes('.m3u8') || url.includes('m3u8');

    if (isHls && Hls.isSupported()) {
      hlsInstance = new Hls({ enableWorker: true });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      hlsInstance.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) showError();
      });
    } else if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      video.src = url;
      video.play();
    } else {
      // MP4 / direct
      video.src = url;
      video.play().catch(showError);
    }

    video.onerror = showError;
  }

  function showError() {
    document.getElementById('player').style.display = 'none';
    document.getElementById('player-error').style.display = 'block';
  }

  function close() {
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('player');
    overlay.classList.remove('active');
    video.pause();
    video.src = '';
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  }

  document.getElementById('close-btn').addEventListener('click', close);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') close();
  });

  function escape(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
